<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ค้นหาราคาอะไหล่แท้ - Carrier Thailand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'], },
                    colors: {
                        carrier: { blue: '#0033a0', lightblue: '#005eb8', dark: '#0a1121', gray: '#f8fafc', accent: '#e2f0fd' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        body:not(.role-admin) .admin-only { display: none !important; }
        body:not(.role-dealer) .dealer-visible { display: none !important; }
        body.role-engineer .price-column { display: none !important; }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

    <div id="loginScreen" class="fixed inset-0 z-[200] bg-carrier-blue flex flex-col items-center justify-center p-4">
        <div class="absolute inset-0 opacity-10">
            <svg class="h-full w-full" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,0 Q50,100 100,0 V100 H0 Z" fill="white"></path></svg>
        </div>
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full relative z-10 text-center border border-white/20">
            <img src="https://carrierthailand.com/wp-content/uploads/2023/02/logo-carrier-2025-2.png" alt="Carrier Logo" class="h-14 w-auto mx-auto mb-6 object-contain">
            <h2 class="text-2xl font-bold text-slate-800 mb-2">เข้าสู่ระบบ</h2>
            <p class="text-slate-500 mb-6 text-base">ระบบค้นหาราคาและพาร์ทอะไหล่สำหรับตัวแทนจำหน่ายและช่าง</p>
            
            <div id="loginError" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-200 text-left font-medium"></div>

            <form id="loginForm" class="space-y-4 text-left">
                <div>
                    <label class="block text-base font-medium text-slate-700 mb-1">ชื่อผู้ใช้ (Username)</label>
                    <input type="text" id="username" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-carrier-lightblue transition-all text-base" placeholder="กรอกชื่อผู้ใช้" required>
                </div>
                <div>
                    <label class="block text-base font-medium text-slate-700 mb-1">รหัสผ่าน (Password)</label>
                    <input type="password" id="password" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-carrier-lightblue transition-all text-base" placeholder="กรอกรหัสผ่านของคุณ" required>
                </div>
                <button type="submit" id="loginSubmitBtn" class="w-full bg-carrier-lightblue hover:bg-carrier-blue text-white font-medium py-3 rounded-xl transition-colors mt-2 shadow-lg text-base">
                    เข้าสู่ระบบ
                </button>
            </form>
            <div class="mt-6 pt-4 border-t border-slate-100 text-sm text-slate-400">
                เฉพาะผู้มีสิทธิ์เข้าถึงระบบของ บี.กริม แคเรียร์ เท่านั้น
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex-col min-h-screen">
        <header class="sticky top-0 z-[100] bg-white shadow-md border-b border-slate-200 transition-all duration-300">
            <nav class="bg-white text-slate-800 py-3.5 px-4 md:px-8 border-b border-slate-100">
                <div class="max-w-[1600px] mx-auto flex justify-between items-center gap-4">
                    <div class="flex items-center gap-2 md:gap-4">
                        <a href="#" class="flex items-center gap-2 md:gap-4">
                            <img src="https://carrierthailand.com/wp-content/uploads/2023/02/logo-carrier-2025-2.png" class="h-8 md:h-10 w-auto object-contain">
                            <div class="h-8 w-px bg-slate-200 mx-1 md:mx-2"></div>
                            <div class="flex flex-col justify-center">
                                <span class="text-xs md:text-sm font-bold mb-0.5 text-carrier-blue">บริษัท บี.กริม แคเรียร์ (ประเทศไทย) จำกัด</span>
                                <span class="text-sm md:text-base font-medium text-slate-500">ระบบค้นหาราคาอะไหล่แท้</span>
                            </div>
                        </a>
                    </div>
                    <div class="flex items-center gap-2 md:gap-4">
                        <span id="dbStatusBadge" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-semibold bg-slate-100 text-slate-600 border border-slate-200">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
                            <span>กำลังรอเชื่อมข้อมูล...</span>
                        </span>
                        <span id="userRoleBadge" class="hidden md:inline-flex items-center px-3 py-1.5 rounded-full text-sm font-semibold bg-blue-50 text-carrier-blue border border-blue-100"></span>
                        <button id="logoutBtn" class="text-base font-medium text-slate-600 hover:text-red-600 flex items-center gap-1.5 bg-slate-50 hover:bg-red-50 px-3 py-1.5 rounded-xl border border-slate-200">
                            <i data-lucide="log-out" class="w-5 h-5"></i> <span class="hidden md:inline font-medium">ออกจากระบบ</span>
                        </button>
                    </div>
                </div>
            </nav>
            <div class="bg-slate-50 border-t border-slate-200/60 py-3 px-4 md:px-8">
                <div class="max-w-[1600px] mx-auto flex flex-col lg:flex-row gap-2.5">
                    <div class="flex-1 flex items-center px-3.5 bg-white rounded-xl border border-slate-300 shadow-sm">
                        <i data-lucide="search" class="text-slate-400 w-5 h-5"></i>
                        <input type="text" id="searchInput" placeholder="รุ่น, ซีรีส์ หรือ รหัสอะไหล่..." class="w-full py-2.5 px-3 outline-none text-slate-700 bg-transparent text-base">
                        <button id="clearBtn" class="hidden text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="flex-1 flex items-center px-3.5 bg-white rounded-xl border border-slate-300 shadow-sm">
                        <i data-lucide="file-text" class="text-slate-400 w-5 h-5"></i>
                        <input type="text" id="descSearchInput" placeholder="ค้นหาชื่ออะไหล่..." class="w-full py-2.5 px-3 outline-none text-slate-700 bg-transparent text-base">
                        <button id="clearDescBtn" class="hidden text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="w-full lg:w-44 flex items-center px-3.5 bg-white rounded-xl border border-slate-300 shadow-sm">
                        <i data-lucide="filter" class="text-slate-400 w-5 h-5"></i>
                        <select id="typeFilter" class="w-full py-2.5 pl-2 pr-4 outline-none text-slate-600 bg-transparent text-base cursor-pointer">
                            <option value="ALL">ทุกประเภท</option>
                            <option value="FCU">FCU (คอยล์เย็น)</option>
                            <option value="CDU">CDU (คอยล์ร้อน)</option>
                        </select>
                    </div>
                    <div class="admin-only w-full lg:w-36 flex items-center bg-orange-50/80 border border-orange-200 px-3.5 rounded-xl shadow-sm">
                        <i data-lucide="percent" class="text-orange-500 w-5 h-5"></i>
                        <input type="number" id="discountInput" placeholder="ส่วนลด %" min="0" max="100" value="0" class="w-full py-2.5 bg-transparent outline-none text-orange-700 font-bold text-center text-base">
                    </div>
                    <div class="flex gap-2">
                        <button id="searchBtn" class="flex-grow lg:flex-none bg-carrier-lightblue hover:bg-carrier-blue text-white font-medium py-2 px-6 rounded-xl shadow-md flex items-center justify-center gap-2 text-base">
                            <i data-lucide="arrow-right-circle" class="w-5 h-5"></i> <span>ค้นหา</span>
                        </button>
                        <button id="refreshBtn" class="bg-white hover:bg-slate-100 text-slate-600 border border-slate-300 py-2 px-3.5 rounded-xl shadow-sm flex items-center justify-center">
                            <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-grow w-full max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-blue-50 text-carrier-lightblue rounded-xl"><i data-lucide="layers" class="w-6 h-6"></i></div>
                    <h2 class="text-xl font-bold text-slate-800">คลังข้อมูลผลลัพธ์อะไหล่</h2>
                </div>
                <div class="flex items-center gap-2">
                    <sp
